<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>花艺师培训 - 花束绑扎模拟</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    #app { width: 100%; height: 100%; position: relative; overflow: hidden; }
    #canvas-container { width: 100%; height: 100%; touch-action: none; }
    .ui-panel {
      position: absolute;
      background: rgba(20, 20, 40, 0.85);
      color: #fff;
      border-radius: 12px;
      padding: 16px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      user-select: none;
    }
    #stage-indicator {
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      font-weight: 600;
      padding: 12px 24px;
    }
    #progress-panel {
      top: 20px;
      right: 20px;
      min-width: 140px;
      font-size: 14px;
    }
    .progress-row { display: flex; justify-content: space-between; margin: 6px 0; }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      transition: width 0.3s ease;
    }
    #control-panel {
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90%;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      min-width: 80px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }
    .btn:active { transform: translateY(0); }
    .btn.secondary { background: linear-gradient(135deg, #f093fb, #f5576c); }
    .btn.success { background: linear-gradient(135deg, #4facfe, #00f2fe); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    #feedback-panel {
      top: 80px;
      left: 20px;
      max-width: 200px;
      font-size: 13px;
    }
    .feedback-item {
      padding: 6px 10px;
      margin: 4px 0;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
    }
    .feedback-item.warning { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
    .feedback-item.danger { background: rgba(244, 67, 54, 0.2); color: #f44336; }
    .feedback-item.success { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
    #hint-text {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      text-align: center;
      pointer-events: none;
    }
    @media (max-width: 768px) {
      #stage-indicator { font-size: 14px; padding: 8px 16px; top: 10px; }
      #progress-panel { top: 10px; right: 10px; font-size: 12px; padding: 10px; min-width: 100px; }
      #control-panel { bottom: 10px; gap: 6px; }
      .btn { padding: 8px 14px; font-size: 12px; min-width: 60px; }
      #feedback-panel { top: 60px; left: 10px; font-size: 11px; max-width: 140px; padding: 10px; }
      #hint-text { bottom: 80px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-container"></div>
    
    <div id="stage-indicator" class="ui-panel">第 1 阶段：取花茎</div>
    
    <div id="progress-panel" class="ui-panel">
      <div class="progress-row"><span>进度</span><span id="progress-text">0%</span></div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width: 0%"></div></div>
      <div class="progress-row" style="margin-top: 10px;"><span>花茎数</span><span id="stem-count">0 / 8</span></div>
      <div class="progress-row"><span>绑扎力</span><span id="bind-force">--</span></div>
    </div>
    
    <div id="feedback-panel" class="ui-panel">
      <div style="font-weight: 600; margin-bottom: 8px;">反馈</div>
      <div id="feedback-list"></div>
    </div>
    
    <div id="hint-text">点击料架上的花茎取出，点击花泥插入</div>
    
    <div id="control-panel" class="ui-panel">
      <button id="btn-reset" class="btn secondary">重置</button>
      <button id="btn-bind" class="btn success">绑扎丝带</button>
      <button id="btn-wrap" class="btn" disabled>包装纸</button>
      <button id="btn-next" class="btn" disabled>下一阶段</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
