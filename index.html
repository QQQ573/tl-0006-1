<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>花艺师培训 - 花束绑扎模拟</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    #app { width: 100%; height: 100%; position: relative; overflow: hidden; }
    #canvas-container { width: 100%; height: 100%; touch-action: none; }
    .ui-panel {
      position: absolute;
      background: rgba(20, 20, 40, 0.85);
      color: #fff;
      border-radius: 12px;
      padding: 16px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      user-select: none;
    }
    #stage-indicator {
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      font-weight: 600;
      padding: 12px 24px;
    }
    #progress-panel {
      top: 20px;
      right: 20px;
      min-width: 140px;
      font-size: 14px;
    }
    .progress-row { display: flex; justify-content: space-between; margin: 6px 0; }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      transition: width 0.3s ease;
    }
    #control-panel {
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90%;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      min-width: 80px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }
    .btn:active { transform: translateY(0); }
    .btn.secondary { background: linear-gradient(135deg, #f093fb, #f5576c); }
    .btn.success { background: linear-gradient(135deg, #4facfe, #00f2fe); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    #feedback-panel {
      top: 80px;
      left: 20px;
      max-width: 200px;
      font-size: 13px;
    }
    .feedback-item {
      padding: 6px 10px;
      margin: 4px 0;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
    }
    .feedback-item.warning { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
    .feedback-item.danger { background: rgba(244, 67, 54, 0.2); color: #f44336; }
    .feedback-item.success { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
    #hint-text {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      text-align: center;
      pointer-events: none;
    }
    .score-item { display: flex; justify-content: space-between; margin: 4px 0; font-size: 12px; }
    .score-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .score-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .score-fill.uniformity { background: linear-gradient(90deg, #4facfe, #00f2fe); }
    .score-fill.bind { background: linear-gradient(90deg, #43e97b, #38f9d7); }
    .score-fill.count { background: linear-gradient(90deg, #fa709a, #fee140); }
    .score-fill.time { background: linear-gradient(90deg, #a18cd1, #fbc2eb); }
    
    #score-panel {
      top: 20px;
      left: 20px;
      min-width: 180px;
      font-size: 13px;
    }
    #score-panel .total-score {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      margin: 8px 0;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #score-panel .score-title {
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
    }
    
    #result-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }
    #result-modal.show { display: flex; }
    
    .result-panel {
      background: linear-gradient(145deg, rgba(30, 30, 60, 0.95), rgba(20, 20, 45, 0.95));
      border-radius: 20px;
      padding: 32px;
      min-width: 340px;
      max-width: 90%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.5s ease-out;
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .result-header { text-align: center; margin-bottom: 20px; }
    .result-grade {
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulse 2s ease-in-out infinite;
    }
    .result-grade.S { background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700); -webkit-background-clip: text; }
    .result-grade.A { background: linear-gradient(135deg, #4facfe, #00f2fe); -webkit-background-clip: text; }
    .result-grade.B { background: linear-gradient(135deg, #43e97b, #38f9d7); -webkit-background-clip: text; }
    .result-grade.C { background: linear-gradient(135deg, #fa709a, #fee140); -webkit-background-clip: text; }
    .result-grade.D { background: linear-gradient(135deg, #ff6b6b, #ee5a52); -webkit-background-clip: text; }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .result-total {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 8px;
    }
    .result-total strong {
      font-size: 28px;
      color: #fff;
      margin: 0 4px;
    }
    
    .result-scores {
      margin: 20px 0;
      padding: 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
    }
    
    .result-score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .result-score-row:last-child { border-bottom: none; }
    .result-score-label { color: rgba(255, 255, 255, 0.8); }
    .result-score-value {
      font-weight: 600;
      font-size: 16px;
    }
    
    .result-stats {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      display: flex;
      justify-content: space-around;
      margin: 16px 0;
    }
    .result-stat { text-align: center; }
    .result-stat-value { font-size: 16px; font-weight: 600; color: #fff; }
    
    .result-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .result-actions .btn { flex: 1; }
    
    #history-panel {
      top: auto;
      bottom: 140px;
      right: 20px;
      max-height: 280px;
      width: 220px;
      overflow-y: auto;
      font-size: 12px;
    }
    #history-panel .history-title {
      font-weight: 600;
      margin-bottom: 8px;
      position: sticky;
      top: 0;
      background: rgba(20, 20, 40, 0.95);
      padding: 4px 0;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      margin: 2px 0;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
    }
    .history-item .rank {
      width: 20px;
      text-align: center;
      font-weight: 600;
    }
    .history-item .rank.top1 { color: #ffd700; }
    .history-item .rank.top2 { color: #c0c0c0; }
    .history-item .rank.top3 { color: #cd7f32; }
    .history-item .score { font-weight: 600; }
    .history-item .date { color: rgba(255, 255, 255, 0.5); font-size: 11px; }
    .history-empty {
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      padding: 16px 0;
    }
    
    .grade-badge {
      display: inline-block;
      width: 20px;
      height: 20px;
      line-height: 20px;
      text-align: center;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }
    .grade-badge.S { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #fff; }
    .grade-badge.A { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #fff; }
    .grade-badge.B { background: linear-gradient(135deg, #43e97b, #38f9d7); color: #fff; }
    .grade-badge.C { background: linear-gradient(135deg, #fa709a, #fee140); color: #fff; }
    .grade-badge.D { background: linear-gradient(135deg, #ff6b6b, #ee5a52); color: #fff; }
    
    @media (max-width: 768px) {
      #score-panel { top: 10px; left: 10px; font-size: 11px; padding: 10px; min-width: 120px; }
      #score-panel .total-score { font-size: 18px; }
      #history-panel { bottom: 120px; right: 10px; width: 160px; font-size: 11px; max-height: 180px; }
      .result-panel { min-width: 280px; padding: 24px; }
      .result-grade { font-size: 56px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-container"></div>
    
    <div id="stage-indicator" class="ui-panel">第 1 阶段：取花茎</div>
    
    <div id="score-panel" class="ui-panel">
      <div class="score-title">实训评分</div>
      <div class="total-score" id="score-total">--</div>
      <div class="score-item">
        <span>插花均匀度</span>
        <span id="score-uniformity">--</span>
      </div>
      <div class="score-bar"><div class="score-fill uniformity" id="bar-uniformity" style="width: 0%"></div></div>
      <div class="score-item">
        <span>绑扎力度</span>
        <span id="score-bind">--</span>
      </div>
      <div class="score-bar"><div class="score-fill bind" id="bar-bind" style="width: 0%"></div></div>
      <div class="score-item">
        <span>花材数量</span>
        <span id="score-count">--</span>
      </div>
      <div class="score-bar"><div class="score-fill count" id="bar-count" style="width: 0%"></div></div>
      <div class="score-item">
        <span>完成时间</span>
        <span id="score-time">--</span>
      </div>
      <div class="score-bar"><div class="score-fill time" id="bar-time" style="width: 0%"></div></div>
    </div>
    
    <div id="progress-panel" class="ui-panel">
      <div class="progress-row"><span>进度</span><span id="progress-text">0%</span></div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width: 0%"></div></div>
      <div class="progress-row" style="margin-top: 10px;"><span>花茎数</span><span id="stem-count">0 / 8</span></div>
      <div class="progress-row"><span>绑扎力</span><span id="bind-force">--</span></div>
    </div>
    
    <div id="feedback-panel" class="ui-panel">
      <div style="font-weight: 600; margin-bottom: 8px;">反馈</div>
      <div id="feedback-list"></div>
    </div>
    
    <div id="history-panel" class="ui-panel">
      <div class="history-title">🏆 成绩排行</div>
      <div id="history-list"></div>
    </div>
    
    <div id="hint-text">点击料架上的花茎取出，点击花泥插入</div>
    
    <div id="control-panel" class="ui-panel">
      <button id="btn-reset" class="btn secondary">重置</button>
      <button id="btn-bind" class="btn success">绑扎丝带</button>
      <button id="btn-wrap" class="btn" disabled>包装纸</button>
      <button id="btn-next" class="btn" disabled>下一阶段</button>
    </div>
    
    <div id="result-modal">
      <div class="result-panel">
        <div class="result-header">
          <div class="result-grade" id="result-grade">S</div>
          <div class="result-total">综合得分 <strong id="result-total">95</strong> 分</div>
        </div>
        
        <div class="result-scores">
          <div class="result-score-row">
            <span class="result-score-label">插花均匀度</span>
            <span class="result-score-value" id="result-uniformity">90</span>
          </div>
          <div class="result-score-row">
            <span class="result-score-label">绑扎力度</span>
            <span class="result-score-value" id="result-bind">95</span>
          </div>
          <div class="result-score-row">
            <span class="result-score-label">花材数量</span>
            <span class="result-score-value" id="result-count">100</span>
          </div>
          <div class="result-score-row">
            <span class="result-score-label">完成时间</span>
            <span class="result-score-value" id="result-time">85</span>
          </div>
        </div>
        
        <div class="result-stats">
          <div class="result-stat">
            <div class="result-stat-value" id="result-stems">8</div>
            <div>花茎数</div>
          </div>
          <div class="result-stat">
            <div class="result-stat-value" id="result-breaks">0</div>
            <div>折断数</div>
          </div>
          <div class="result-stat">
            <div class="result-stat-value" id="result-timeused">1:23</div>
            <div>用时</div>
          </div>
        </div>
        
        <div class="result-actions">
          <button id="btn-result-retry" class="btn secondary">再来一次</button>
          <button id="btn-result-close" class="btn success">查看排行</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
